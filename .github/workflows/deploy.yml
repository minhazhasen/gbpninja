name: Deploy app.gbpninja.com

# Push to main → check → build a standalone Next.js server → pack it as ONE archive → FTPS upload (3 files) → restart.
# On start, deploy/server.js (the cPanel startup file) unpacks app.tar.gz into ./app and runs it. Uploading the ~2,000 loose
# files one by one over FTPS took over an hour on this host; one archive takes a minute.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (FTP account rooted at the app folder, e.g. ~/app.gbpninja.com/deploy).
# Variables: NEXT_PUBLIC_FIREBASE_* (built into the browser bundle). Server-only keys live in cPanel → Setup Node.js App.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # A newer push replaces a deploy still uploading.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Schema SQL
        run: npm run db:sql

      - name: Check
        run: npm run typecheck && npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # bundle/ = server.js + trimmed node_modules (incl. the rhel-openssl-1.1.x Prisma engine) + static assets + public files,
      # packed into release/app.tar.gz next to the loader (deploy/server.js) and the release id.
      # tmp/restart.txt changes every deploy, which tells LiteSpeed / Passenger to restart the Node.js app.
      - name: Assemble release
        run: |
          mkdir -p bundle/.next release/tmp
          cp -a .next/standalone/. bundle/
          cp -a .next/static bundle/.next/static
          cp -a public bundle/public
          rm -f bundle/.env bundle/.env.*
          test -f bundle/server.js
          ls bundle/node_modules/.prisma/client | grep -q rhel-openssl-1.1.x
          tar -czf release/app.tar.gz -C bundle .
          cp deploy/server.js release/server.js
          echo "${{ github.sha }}" > release/release.txt
          echo "${{ github.sha }} $(date -u +%FT%TZ)" > release/tmp/restart.txt
          ls -la release release/tmp

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./release/
          server-dir: ./
          # The default exclude list skips node_modules, which the standalone server needs.
          exclude: |
            **/.git*
            **/.git*/**
